                            $.ajax({
                                url: $('#satisfactionForm').attr('action')
                                , type: 'post'

                                if (data.success) {

                                    location.reload();
                                } else {
                                    alert(data.text);
                                }
                            }).fail(function () {

    <script>
        const provinces = document.querySelectorAll('.province');
        const contents = document.querySelectorAll('.tab-content');
        const tspans = document.querySelectorAll('tspan');

        function activateTab(tabName) {
            // reset
            provinces.forEach(p => p.classList.remove('active'));
            contents.forEach(c => c.classList.remove('active'));
            tspans.forEach(c => c.classList.remove('active'));

            // activate selected
            document
                .querySelector(`.province[data-tab="${tabName}"]`)
                .classList.add('active');

            document
                .getElementById(`text-${tabName}`)
                .classList.add('active');

            document
                .getElementById(`tab-${tabName}`)
                .classList.add('active');
        }

        provinces.forEach(province => {
            const tab = province.dataset.tab;

            province.addEventListener('click', () => activateTab(tab));
            province.addEventListener('keydown', e => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    activateTab(tab);
                }
            });
        });

    </script>
