<script>
    document.addEventListener("DOMContentLoaded", () => {

        async function includeHTML(id, filePath) {
            const html = await fetch(filePath).then(res => res.text());
            document.getElementById(id).innerHTML = html;
        }

        Promise.all([
            includeHTML("header", "./header.htm"),
            includeHTML("footer", "./footer.htm")
        ]).then(() => {
            const script1 = document.createElement("script");
            script1.src = "./static/js/header.js";
            document.body.appendChild(script1);

            const script2 = document.createElement("script");
            script2.src = "./static/js/footer.js";
            document.body.appendChild(script2);
        });
    });
    </script>
