    <link rel="stylesheet" href="./static/css/fullCalendar.css">
    <script src='./static/js/cdn/fullCalendar.js'></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
    var calendarEl = document.getElementById('calendar');
    var calendar = new FullCalendar.Calendar(calendarEl, {
        locale: 'ko',  // 한글 로케일
        dayHeaderFormat: { weekday: 'short' }, // 요일 형식 간략히 표시 (예: 월, 화, 수, ...)
        dayCellContent: function (info) {
            // 날짜 셀에서 '일'을 제거하고 숫자만 표시
            info.dayNumberText = info.dayNumberText.replace('일', '');
            return info.dayNumberText;
        },

        timezone: 'local',
        initialView: 'dayGridMonth',
        fixedWeekCount: false,
        events: [
            { title: 'ordinary', start: '2026-13-01', eventType: 'ordinary' },
            { title: 'ordinary', start: '2026-03-02', eventType: 'ordinary' },
            { title: 'Good', start: '2026-03-03', eventType: 'good' },
            { title: 'Very Good', start: '2026-03-04', eventType: 'verygood' },
            { title: 'Bad', start: '2026-03-08', eventType: 'bad' },
            { title: 'Good', start: '2026-03-15', eventType: 'good' },
            { title: 'Ordinary', start: '2026-03-20', eventType: 'ordinary' },
            { title: 'Bad', start: '2026-03-26', eventType: 'bad' },
            { title: 'Very Good', start: '2026-04-01', eventType: 'verygood' },
            { title: 'Bad', start: '2026-04-02', eventType: 'bad' },
            { title: 'Good', start: '2026-04-04', eventType: 'good' }
        ],

        headerToolbar: {
            left: 'prev',       // 왼쪽에 이전/다음 버튼
            center: 'title',    // 중앙에 제목
            right: 'next',       // 오른쪽에 오늘 버튼
        },

        contentHeight: 'auto', // 기본적으로 높이를 자동으로 설정
        eventDidMount: function (info) {
            // 이벤트 날짜 정보
            var eventDate = info.event.startStr.split('T')[0];  // 날짜 형식 'YYYY-MM-DD'

            // 해당 날짜 셀 찾기
            var dateCell = document.querySelector(`td[data-date="${eventDate}"]`);
            if (dateCell) {
                // has-event 클래스 추가
                dateCell.classList.add('has-event');

                // 이벤트 타입에 따라 적절한 feel 클래스를 추가
                var eventType = info.event.extendedProps.eventType;
                if (eventType === 'verygood') {
                    dateCell.classList.add('feel_5');
                } else if (eventType === 'good') {
                    dateCell.classList.add('feel_4');
                } else if (eventType === 'ordinary') {
                    dateCell.classList.add('feel_3');
                } else if (eventType === 'bad') {
                    dateCell.classList.add('feel_2');
                } else if (eventType === 'verybad') {
                    dateCell.classList.add('feel_1');
                }

                // 'blind' 클래스를 추가하여 텍스트 숨기기
                var eventText = dateCell.querySelector('.fc-event-title'); // 텍스트가 들어있는 부분
                if (eventText) {
                    var eventDate = dateCell.querySelector('.fc-daygrid-day-number');
                    eventDate.classList.add('blind');
                    eventText.classList.add('blind');
                }
            }
        },

        // 날짜 셀 갱신 시 feel_* 클래스와 has-event 클래스 재적용 (datesSet 이벤트 활용)
        datesSet: function() {
            // 날짜 셀에 대한 feel_* 클래스와 has-event 클래스 다시 적용
            var allEvents = calendar.getEvents();  // 모든 이벤트 정보를 가져옴
            allEvents.forEach(function(event) {
                var eventDate = event.startStr.split('T')[0];  // 'YYYY-MM-DD' 형식
                var dateCell = document.querySelector(`td[data-date="${eventDate}"]`);

                if (dateCell) {
                    // has-event 클래스 추가
                    dateCell.classList.add('has-event');

                    // 이벤트 타입에 맞는 feel 클래스를 추가
                    var eventType = event.extendedProps.eventType;
                    dateCell.classList.remove('feel_5', 'feel_4', 'feel_3', 'feel_2', 'feel_1'); // 기존 feel_* 클래스 제거
                    if (eventType === 'verygood') {
                        dateCell.classList.add('feel_5');
                    } else if (eventType === 'good') {
                        dateCell.classList.add('feel_4');
                    } else if (eventType === 'ordinary') {
                        dateCell.classList.add('feel_3');
                    } else if (eventType === 'bad') {
                        dateCell.classList.add('feel_2');
                    } else if (eventType === 'verybad') {
                        dateCell.classList.add('feel_1');
                    }
                }
            });
        }
    });

    // 캘린더 렌더링
    calendar.render();
});

    </script>
